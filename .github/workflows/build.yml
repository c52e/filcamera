name: Android
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          # Google's retired tools package is included in this action's defaults.
          packages: platform-tools
      - name: Install pinned Android toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          # Override the runner image's default NDK for this and subsequent steps.
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          python -c "from tools.build_support import ndk_path; print('Selected NDK:', ndk_path())"
      - run: python tools/audit_public.py
      - run: python -m unittest discover -s tools -p "test_*.py"
      - run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: FILCamera-debug-${{ github.sha }}
          if-no-files-found: error
          path: artifacts/delivery/debug/

